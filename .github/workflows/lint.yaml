---
name: "Lint"
on:
  push:
    branches-ignore:
      - "main"
  workflow_call:
jobs:
  oxlint:
    name: "Run oxlint"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "pnpm/action-setup@v6"
        with:
          version: "latest"
      - uses: "actions/setup-node@v7"
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
      - name: "Install Dependencies"
        run: "pnpm install --frozen-lockfile"
      - name: "Build i18n"
        run: "pnpm build:i18n"
      - name: "Run oxlint"
        run: "pnpm lint:ts"
  oxfmt:
    name: "Run oxfmt"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "pnpm/action-setup@v6"
        with:
          version: "latest"
      - uses: "actions/setup-node@v7"
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
      - name: "Install Dependencies"
        run: "pnpm install --frozen-lockfile"
      - name: "Run oxfmt"
        run: "pnpm oxfmt"
  markdownlint:
    name: "Run Markdownlint"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "pnpm/action-setup@v6"
        with:
          version: "latest"
      - uses: "actions/setup-node@v7"
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
      - name: "Install Dependencies"
        run: "pnpm install --frozen-lockfile"
      - name: "Run markdownlint"
        run: "pnpm lint:md"
  yaml:
    name: "Lint YAML"
    runs-on: "ubuntu-latest"
    container:
      image: "alpine:latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: "Install yamllint"
        run: "apk add yamllint"
      - name: "Run yamllint"
        run: "yamllint -s ."
